<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop curated fashion, beauty, and everyday finds at Berry's Closet.">
    <title>Berry's Closet</title>
    <link rel="stylesheet" href="./src/index.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>

    <template id="home-header-template">
      <div class="announcement-bar"><span>✦ Curated style, beauty & everyday finds</span><span>Accra-based · Made for you</span></div>
      <header class="site-header home-header">
        <div class="home-header-main">
          <a class="brand" href="#top">Berry's <span>Closet</span></a>
          <form class="home-search" data-form="site-search" role="search">
            <input name="query" type="search" placeholder="Search products and collections..." aria-label="Search products and collections">
            <button type="submit" aria-label="Search">⌕</button>
          </form>
          <div class="header-actions">
            <a class="header-account" href="/login"><span aria-hidden="true">♙</span><small>Account</small></a>
            <button class="icon-button" data-action="theme" aria-label="Toggle theme">◐</button>
            <button class="cart-button" data-action="cart" aria-label="Open shopping cart">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2.3 9.1a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 7H7"/><circle cx="10" cy="18.5" r="1.2"/><circle cx="17" cy="18.5" r="1.2"/></svg>
              <span>Cart</span><b id="cart-count">0</b>
            </button>
          </div>
        </div>
        <div class="nav-shell home-nav-shell">
          <button class="menu-toggle home-menu-toggle" type="button" data-action="nav-toggle" aria-label="Open categories" aria-expanded="false">☰ <span>All Categories</span></button>
          <nav class="nav-main" aria-label="Main navigation">
            <a href="#/" class="nav-link" data-route-link="home">Home</a>
            <a href="#services" class="nav-link" data-route-link="services">About Us</a>
            <a href="#contact" class="nav-link" data-route-link="contact">Contact</a>
            <a href="#support" class="nav-link" data-route-link="support">Support</a>
            <a href="#collections" class="nav-link" data-route-link="collections">Shop With Us</a>
            <a href="/signup" class="nav-link" data-route-link="signup">Join Us</a>
          </nav>
        </div>
        <div class="category-menu" aria-label="Shop categories" data-category-list></div>
      </header>
    </template>

    <template id="standard-header-template">
      <header class="site-header">
        <a class="brand" href="#top">Berry's <span>Closet</span></a>
        <div class="nav-shell">
          <nav class="nav-main" aria-label="Main navigation">
            <a href="#/" class="nav-link" data-route-link="home">Home</a>
            <a href="#services" class="nav-link" data-route-link="services">About Us</a>
            <a href="#contact" class="nav-link" data-route-link="contact">Contact</a>
            <a href="#support" class="nav-link" data-route-link="support">Support</a>
            <a href="#collections" class="nav-link" data-route-link="collections">Shop With Us</a>
            <a href="/signup" class="nav-link" data-route-link="signup">Join Us</a>
          </nav>
          <button class="menu-toggle" type="button" data-action="nav-toggle" aria-label="Open categories" aria-expanded="false">☰</button>
        </div>
        <div class="category-menu" aria-label="Shop categories" data-category-list></div>
        <div class="header-actions">
          <button class="icon-button" data-action="theme" aria-label="Toggle theme">◐</button>
          <button class="cart-button" data-action="cart" aria-label="Open shopping cart">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2.3 9.1a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 7H7"/><circle cx="10" cy="18.5" r="1.2"/><circle cx="17" cy="18.5" r="1.2"/></svg>
            <b id="cart-count">0</b>
          </button>
        </div>
      </header>
    </template>
    <template id="category-link-template"><a class="category-link"></a></template>
    <template id="product-card-template">
      <article class="product-card">
        <div class="product-image"><img loading="lazy" alt=""><span class="tag" hidden></span></div>
        <div class="product-copy"><span class="eyebrow product-category"></span><h3></h3><strong></strong></div>
      </article>
    </template>
    <template id="empty-search-template"><p class="search-empty">No products found. Try another search.</p></template>
    <template id="home-category-template">
      <a class="home-category"><span class="home-category-icon"></span><strong></strong></a>
    </template>
    <template id="promo-card-template">
      <a class="home-promo-card"><span></span><h3></h3><strong></strong></a>
    </template>
    <template id="service-card-template">
      <article class="service-card">
        <div class="service-image"><img loading="lazy" alt=""><span></span></div>
        <div class="service-copy"><h3></h3><p></p><div class="service-meta"><strong></strong><span></span></div><button class="button button-dark" data-service>Book now</button></div>
      </article>
    </template>
    <template id="lookbook-template">
      <section class="section lookbook" id="lookbook">
        <div class="section-heading center"><div><span class="eyebrow">A visual diary</span><h2>Lookbook</h2></div></div>
        <div class="lookbook-frame">
          <img id="lookbook-image" alt=""><div class="lookbook-shade"></div>
          <div class="lookbook-copy"><span class="eyebrow"></span><h3 id="lookbook-title"></h3><p id="lookbook-description"></p></div>
          <button class="carousel-button prev" data-action="look-prev" aria-label="Previous look">←</button>
          <button class="carousel-button next" data-action="look-next" aria-label="Next look">→</button>
        </div>
      </section>
    </template>
    <template id="home-page-template">
      <main id="top" class="storefront-home">
        <section class="hero home-hero">
          <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=2070" alt="A curated fashion collection">
          <div class="hero-shade"></div>
          <div class="hero-copy">
            <span class="eyebrow">Berry's Closet · Accra</span>
            <h1>Elevate your<br><em>everyday.</em></h1>
            <p>Discover thoughtfully chosen fashion, beauty, and everyday finds, all in one place.</p>
            <a class="button button-accent" href="#collections">Shop the collection <span aria-hidden="true">→</span></a>
            <div class="hero-promises"><span>✦ Curated finds</span><span>♡ Made for your style</span><span>⌂ Local support</span></div>
          </div>
          <div class="hero-side-note"><span>THE BERRY'S EDIT</span><strong>Good taste.<br>Every day.</strong></div>
        </section>
        <section class="home-category-strip" id="shop-categories" aria-label="Shop categories"></section>
        <section class="section collections home-featured" id="collections">
          <div class="section-heading">
            <div><span class="eyebrow" id="featured-eyebrow">Picked for you</span><h2 id="featured-title">Top picks for you <span aria-hidden="true">✦</span></h2></div>
            <div class="featured-heading-actions"><a class="text-link" href="#shop-categories">Shop all categories <span aria-hidden="true">→</span></a><div class="scroll-actions"><button class="icon-button" data-action="scroll-products" data-direction="left" aria-label="Scroll products left">←</button><button class="icon-button" data-action="scroll-products" data-direction="right" aria-label="Scroll products right">→</button></div></div>
          </div>
          <div class="product-track home-product-track" id="product-track"></div>
        </section>
        <section class="home-promos" aria-label="Explore the collections"></section>
        <section class="home-values" aria-label="Why shop Berry's Closet">
          <div><span aria-hidden="true">✦</span><strong>Thoughtfully picked</strong><small>Pieces with a little something special</small></div>
          <div><span aria-hidden="true">♡</span><strong>Style for everyone</strong><small>Fashion, beauty, and everyday finds</small></div>
          <div><span aria-hidden="true">⌂</span><strong>Here to help</strong><small>Friendly support when you need it</small></div>
        </section>
        <div data-lookbook-slot></div>
        <section class="section tracking-section" id="support">
          <div class="tracking-copy"><span class="eyebrow">Order updates</span><h2>Track your order</h2><p>Enter the tracking number from your order confirmation.</p></div>
          <form class="tracking-form" data-form="track-order"><input name="trackingId" placeholder="Tracking number" required><button class="button button-accent">Track</button><p id="tracking-result" aria-live="polite"></p></form>
        </section>
        <section class="section services" id="services">
          <div class="section-heading center"><div><span class="eyebrow">What we do</span><h2>Rituals of beauty</h2><p>From everyday glow-ups to special occasions, we make your getting-ready ritual feel like an event.</p></div></div>
          <div class="service-grid"></div>
        </section>
        <section class="section consultation" id="contact">
          <div class="consultation-panel"><span class="eyebrow">Contact us</span><h2>Let’s connect.</h2><p class="intro">Reach out for product requests, styling support, bookings, or quick questions. We’re always happy to help.</p>
            <div class="contact-grid">
              <div class="contact-card"><span class="eyebrow">Phone</span><a href="tel:+233246789012">+233 24 678 9012</a><a href="tel:+233509876543">+233 50 987 6543</a></div>
              <div class="contact-card"><span class="eyebrow">Email</span><a href="mailto:hello@berryscloset.com">hello@berryscloset.com</a><a href="mailto:orders@berryscloset.com">orders@berryscloset.com</a></div>
              <div class="contact-card"><span class="eyebrow">Social</span><a href="https://instagram.com/berryscloset" target="_blank" rel="noreferrer">@berryscloset</a><a href="https://facebook.com/berryscloset" target="_blank" rel="noreferrer">facebook.com/berryscloset</a><a href="https://wa.me/233246789012" target="_blank" rel="noreferrer">WhatsApp: +233 24 678 9012</a></div>
            </div>
          </div>
        </section>
        <section class="section consultation item-request-section" id="consultation"><div class="consultation-panel"><span class="eyebrow">Looking for something special?</span><h2>Request an item.</h2><p class="intro">Tell us what you are looking for and our team will be in touch.</p><button class="button button-accent" data-action="consultation">Submit an item request</button></div></section>
        <section class="newsletter"><div><span class="eyebrow">The Berry's list</span><h2>LUXURY IS CHEAP.</h2><p>Buy quality at a very low price.</p></div><form id="newsletter-form" aria-label="Join the newsletter"><input type="email" name="email" placeholder="Email address" aria-label="Email address" required><button class="button button-line" type="submit">Join the list</button></form></section>
      </main>
    </template>
    <template id="home-footer-template">
      <footer class="home-footer">
        <div class="footer-brand"><a class="brand" href="#top">Berry's <span>Closet</span></a><p>Accra-based. Global style. Thoughtful finds for your everyday.</p></div>
        <div><b>Shop</b><nav data-footer-categories></nav></div>
        <div><b>Customer care</b><a href="#support">Track your order</a><a href="#contact">Contact us</a><a href="#consultation">Request an item</a><a href="/login">My account</a></div>
        <div><b>Follow along</b><a href="https://instagram.com/berryscloset" target="_blank" rel="noreferrer">Instagram</a><a href="https://facebook.com/berryscloset" target="_blank" rel="noreferrer">Facebook</a><a href="https://wa.me/233246789012" target="_blank" rel="noreferrer">WhatsApp</a></div>
        <small>© 2026 Berry's Closet. All rights reserved.</small>
      </footer>
    </template>
    <template id="site-footer-template"><footer><div><a class="brand" href="#top">Berry's <span>Closet</span></a><p>Accra-based. Global style.</p></div><small>© 2026 Berry's Closet. All rights reserved.</small></footer></template>
    <template id="category-page-template">
      <main class="category-page" id="top">
        <section class="category-hero"><div class="category-hero-copy"><span class="eyebrow">Curated edit</span><h1 data-category-name></h1><p data-category-blurb></p><div class="button-row"><a class="button button-accent" href="#collections" data-category-browse></a><a class="button button-line" href="#consultation">Item request</a></div></div></section>
        <section class="section category-content"><div class="section-heading center"><div><span class="eyebrow">Featured picks</span><h2 data-category-heading></h2></div></div><div class="category-grid"></div></section>
      </main>
    </template>
    <template id="cart-page-template">
      <main class="cart-page" id="top"><div class="cart-shell"><div class="section-heading cart-header"><div><span class="eyebrow">Your basket</span><h2>Shopping cart</h2></div></div><div class="cart-grid">
        <section class="cart-items-panel"></section>
        <aside class="cart-summary"><span class="eyebrow">Summary</span><h3>Order total</h3><div class="cart-total-row"><span>Subtotal</span><strong data-subtotal></strong></div><div class="cart-total-row"><span>Delivery</span><strong>GHS0.00</strong></div><div class="cart-total-row total"><span>Total</span><strong data-total></strong></div><button class="button button-accent" data-action="checkout">Checkout</button></aside>
      </div></div></main>
    </template>
    <template id="cart-page-item-template"><article class="cart-page-item"><img alt=""><div class="cart-page-copy"><div><h3></h3><p></p></div><strong data-price></strong></div><div class="cart-page-controls"><div class="quantity"><button data-change="-1">−</button><span></span><button data-change="1">+</button></div><button class="remove">Remove</button></div></article></template>
    <template id="empty-cart-template"><div class="empty-cart"><p>Your cart is empty. Add a few items from the collection.</p><a class="button button-accent" href="#/womens-wear">Continue shopping</a></div></template>
    <template id="item-request-page-template"><main class="item-request-page"><form class="booking-form item-request-form" data-form="consultation"><input name="name" placeholder="Your full name" required><input name="productName" placeholder="Product name" required><input name="photo" type="file" accept="image/*" required><button class="button button-accent">Send request</button></form></main></template>
    <template id="auth-page-template">
      <main class="auth-page"><section class="auth-panel"><a class="brand" href="#/">Berry's <span>Closet</span></a><span class="eyebrow">Your account</span><h1 data-auth-heading></h1><p data-auth-description></p><form class="auth-form"><input name="name" placeholder="Full name" autocomplete="name" required><input name="number" type="tel" placeholder="Mobile number" autocomplete="tel" required><input name="email" type="email" placeholder="Email address" autocomplete="email" required><input name="password" type="password" placeholder="Password" minlength="8" required><button class="button button-accent"></button></form><p class="auth-message" id="auth-message" aria-live="polite"></p><a class="auth-switch"></a></section></main>
    </template>
    <template id="admin-login-template">
      <main class="admin-page"><section class="admin-panel"><span class="eyebrow">Restricted access</span><h1>Admin portal</h1><p data-admin-instructions></p><form class="admin-form"><div data-admin-fields></div><button class="button button-accent"></button></form><button class="admin-secondary" data-action="admin-change-number">Use a different number</button><p class="admin-message" id="admin-message" aria-live="polite"></p></section></main>
    </template>
    <template id="admin-field-number-template"><input name="number" type="tel" autocomplete="tel" placeholder="Mobile number" required></template>
    <template id="admin-field-password-template"><input name="password" type="password" autocomplete="current-password" placeholder="Admin password" required></template>
    <template id="admin-field-code-template"><input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" required></template>
    <template id="admin-dashboard-template">
      <main class="admin-page admin-dashboard"><section class="admin-panel admin-panel-wide">
        <div class="admin-heading"><div><span class="eyebrow">Restricted access</span><h1>Admin dashboard</h1></div><button class="admin-secondary" data-action="admin-logout">Log out</button></div>
        <div class="admin-stats"><div><strong data-request-count></strong><span>Item requests</span></div><div><strong data-order-count></strong><span>Orders</span></div><div><strong data-service-count></strong><span>Services</span></div></div>
        <h2 class="admin-section-title">Order tracking</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Tracking ID</th><th>Type</th><th>Customer</th><th>Order</th><th>Status</th><th>Date</th></tr></thead><tbody data-order-rows></tbody></table></div>
        <h2 class="admin-section-title">Products</h2>
        <form class="admin-form admin-product-form" data-form="admin-product"><input name="name" placeholder="Product name" required><input name="price" type="number" min="0" step="0.01" placeholder="Price (GHS)" required><input name="quantity" type="number" min="1" step="1" placeholder="Stock quantity" required><select name="category" data-category-options></select><input name="photo" type="file" accept="image/*" required><textarea name="description" placeholder="Description"></textarea><button class="button button-accent">Add product</button></form>
        <div class="admin-toolbar"><span data-product-count></span><button class="admin-secondary" data-clear-products>Delete all products</button></div><div class="admin-product-list"></div>
        <h2 class="admin-section-title">Lookbook photos</h2>
        <form class="admin-form admin-product-form" data-form="admin-look"><input name="title" placeholder="Photo title" required><input name="description" placeholder="Short caption"><input name="photo" type="file" accept="image/*" required><button class="button button-accent">Add photo</button></form>
        <div class="admin-toolbar"><span data-look-count></span><button class="admin-secondary" data-clear-looks>Delete all photos</button></div><div class="admin-look-list"></div>
        <h2 class="admin-section-title">Website colors</h2><form class="admin-color-form" data-form="admin-colors"><label>Accent<input name="accent" type="color"></label><label>Background<input name="paper" type="color"></label><label>Text<input name="ink" type="color"></label><button class="button button-accent">Save colors</button></form>
        <p class="admin-message" id="admin-message" aria-live="polite"></p>
      </section></main>
    </template>
    <template id="admin-order-row-template"><tr><td data-tracking-number></td><td data-type></td><td data-customer></td><td data-item></td><td data-status></td><td data-date></td></tr></template>
    <template id="admin-product-edit-template"><form class="admin-product-edit" data-form="admin-product-update"><img alt=""><input name="name" required><input name="price" type="number" min="0" step="0.01" required><input name="quantity" type="number" min="1" required><select name="category" data-category-options></select><textarea name="description" placeholder="Description"></textarea><input name="photo" type="file" accept="image/*"><button class="admin-secondary">Save</button><button type="button" class="admin-secondary">Delete</button></form></template>
    <template id="admin-look-row-template"><div class="admin-photo-row"><img alt=""><span></span><button class="admin-secondary">Delete</button></div></template>
    <template id="admin-empty-row-template"><p></p></template>
    <template id="modal-shell-template"><div class="modal-backdrop" data-action="close-modal"></div><div class="modal"><button class="modal-close" data-action="close-modal">×</button><div class="modal-slot"></div></div></template>
    <template id="product-modal-template"><div class="product-modal"><img alt=""><div class="modal-content"><span class="eyebrow"></span><h2></h2><strong class="price"></strong><p></p><div class="specs"><span><small>Material</small>Premium finish</span><span><small>Fit</small>Curated style</span></div><button class="button button-accent" data-add-product>Add to bag</button></div></div></template>
    <template id="service-modal-template"><div class="modal-content"><span class="eyebrow"></span><h2>Reserve your session.</h2><p></p><form class="booking-form" data-form="service"><input type="hidden" name="serviceName"><input type="hidden" name="servicePrice"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="phone" placeholder="Phone" required><input name="date" type="date" required><select name="time" required><option value="">Preferred time</option><option>9:00 AM</option><option>11:00 AM</option><option>1:00 PM</option><option>3:00 PM</option><option>5:00 PM</option></select><button class="button button-accent">Request booking</button></form></div></template>
    <template id="consultation-modal-template"><div class="modal-content"><span class="eyebrow">Product request</span><h2>Request an item.</h2><p>Share your name, the product you want, and a clear photo to help us find it.</p><form class="booking-form" data-form="consultation"><input name="name" placeholder="Your full name" required><input name="productName" placeholder="Product name" required><input name="photo" type="file" accept="image/*" required><button class="button button-accent">Send request</button></form></div></template>
    <template id="cart-modal-template"><div class="modal-content cart-modal"><span class="eyebrow" data-cart-label></span><h2>Shopping bag.</h2><div data-cart-items></div><div class="cart-total"><span>Subtotal</span><strong data-cart-total></strong></div><button class="button button-accent" data-action="checkout">Checkout</button></div></template>
    <template id="cart-modal-item-template"><div class="cart-item"><img alt=""><div><strong></strong><small></small><div class="quantity"><button data-change="-1">−</button><span></span><button data-change="1">+</button></div></div><button class="remove">Remove</button></div></template>
    <template id="cart-modal-empty-template"><div class="empty">Your bag is waiting for something special.</div></template>
    <template id="checkout-modal-template"><div class="modal-content"><span class="eyebrow">Secure checkout</span><h2>Almost yours.</h2><form class="booking-form" data-form="checkout"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="phone" placeholder="Phone" required><input name="address" placeholder="Delivery address" required><button class="button button-accent"></button></form></div></template>
    <template id="checking-admin-template"><main class="admin-page"><section class="admin-panel"><p>Checking admin session...</p></section></main></template>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script defer src="./main.js"></script>
  </body>
</html>
